# --- Measured CI cost (dogfood-swarm SKILL item 8) --------------------------
# 17 billable min per push across 7 jobs (12.0 min actual wall time),
# measured 2026-09-07 from run 34122801834. Most expensive jobs:
#     4 min  test (node 22.x / ubuntu-latest)  (3.2 min wall)
#     4 min  byte-equal vs golden (node 22.x)  (3.3 min wall)
#     4 min  byte-equal vs golden (node 22.21.1)  (3.3 min wall)
# GitHub bills per JOB, rounded UP to the minute, x2 Windows / x10 macOS, so
# billable minutes exceed wall time — many short jobs cost more than one long
# one. This number is measured, never estimated; re-measure after any change:
#   gh api repos/mcp-tool-shop-org/backprop-trace/actions/runs/<id>/jobs
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ci-future-B-009: manual fallback so the heavy e2e jobs (torch / jax) can be
  # forced on demand even when the import/emission helper path did not change.
  workflow_dispatch:

# ci-future-B-008: cancel superseded runs on the same ref so rapid PR pushes
# don't stack the full multi-OS test + canary + torch matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ci-future-B-009: detect whether the LIVE-helper import/emission path changed,
  # so the two heavy e2e jobs (each installs a large ML wheel — torch / jaxlib)
  # run ONLY when relevant, instead of on EVERY push/PR. This gates the e2e jobs
  # WITHOUT touching the core gates: test / byte-equal / audit have no `needs:` on
  # this job and so continue to run unconditionally on all source changes.
  # Always green (it just reports booleans), so it never blocks anything; on
  # workflow_dispatch the e2e jobs run regardless of the filter (see their `if:`).
  changes:
    name: detect changed paths (gate heavy e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 5  # ci-future-B-007: bound a hung filter/checkout
    outputs:
      helpers: ${{ steps.filter.outputs.helpers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            helpers:
              - 'scripts/extract/**'
              - 'src/import-*.ts'
              - 'src/general-engine.ts'
              - 'src/reconcile.ts'
              - 'test/import-*helper*'
              - '.github/workflows/ci.yml'

  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # ci-future-B-007: bound a hung typecheck/build/test
    strategy:
      fail-fast: false
      matrix:
        # Routine unit-test matrix is ubuntu-only, per the org GitHub-Actions
        # rule (never macos-latest [~10x cost], avoid windows-latest [~2x] for a
        # CPU-only Node tool) — G-033. ubuntu Node 22.x is the CONTRACTUAL
        # determinism platform: byte-exact goldens AND the bp-examples-print
        # byte-identity check are guaranteed here, NOT cross-OS (Determinism
        # boundary doc). The former macos cell existed to DETECT V8 fdlibm
        # Math.exp drift — it already did its job (caught the 22.11.0 drift),
        # and a cross-OS byte-identity check on macos is a non-contract (it was
        # failing on a CRLF/line-ending artifact, not a logic defect — the same
        # suite is green on ubuntu + windows). Cross-OS coverage that IS
        # OS-relevant (tarball + child_process + bundled-file resolution) lives
        # in pack-smoke.yml, which STAYS 3-OS. The Math.exp(-0.5) canary + the
        # byte-equal job (ubuntu) remain the standing determinism gates; re-add
        # a manual workflow_dispatch 3-OS cell if cross-OS drift re-detection is
        # ever wanted.
        node: ['22.x']
        os: [ubuntu-latest]
    env:
      # 'true' on a pull request or a push to the default branch, the runs
      # whose coverage and test results go to Codecov.
      COVERAGE_LEG: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # pnpm version comes from package.json `packageManager` field; do not
        # also pass `version:` here — pnpm/action-setup rejects the duplicate
        # spec with ERR_PNPM_BAD_PM_VERSION.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # v0.10.2: build BEFORE test. The v0.10 CLI test plate
      # (test/bp.examples-pytorch.cli.test.ts +
      # test/bp.*.cli.test.ts) spawns `node dist/bin/bp.js` and asserts
      # the build artifact exists. v0.9.x had no such dependency so
      # test-before-build worked; v0.10+ requires build-first.
      - run: pnpm build
      - id: tests
        run: pnpm test
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
          # On the coverage leg every Node process the tests start leaves raw V8
          # coverage outside the tree, and the test runner also writes JUnit to
          # junit.xml where it runs; elsewhere both variables are empty, which
          # Node reads as unset.
          NODE_OPTIONS: ${{ env.COVERAGE_LEG == 'true' && '--test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml' || '' }}
          NODE_V8_COVERAGE: ${{ env.COVERAGE_LEG == 'true' && format('{0}/v8-coverage', runner.temp) || '' }}
      # One lcov report from the raw coverage every Node process of the
      # tests left. The exact version keeps npx from fetching whichever c8
      # is newest on the day.
      - name: Coverage report for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        run: npx --yes c8@12.0.0 report --temp-directory "$RUNNER_TEMP/v8-coverage" --reporter=lcov --reporter=text-summary --report-dir coverage/c8
      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage/c8/lcov.info
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'cancelled' && needs.test.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: coverage/c8
      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .
      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.test.result == 'success' || hashFiles('coverage/c8/lcov.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage/c8/lcov.info
      - name: Upload test results to Codecov
        if: ${{ needs.test.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml

  byte-equal:
    name: byte-equal vs golden (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20  # ci-future-B-007: bound a hung build/test/diff
    strategy:
      fail-fast: false
      matrix:
        # ci-future-B-003: the determinism canary observes BOTH a moving
        # target and a FIXED reference on every run, per
        # docs/computation-order.md "Determinism boundary" (the v0.4 design
        # intent). `.nvmrc` pins the same reference patch for local repro.
        #   - '22.x'    — moving target: an early-warning siren for V8 fdlibm
        #                 Math.exp drift WITHIN the 22.x line.
        #   - '22.21.1' — FIXED reference: the exact patch the shipped goldens
        #                 (fixtures/mazur.golden.jsonl) + the math-exp canary
        #                 constants were emitted on. Expected to PASS byte-equal;
        #                 a RED here means the golden itself drifted, not V8.
        # ubuntu-only (the contractual byte-equal matrix is Node-pinned, not
        # OS-pinned for this canary), so this is 2 jobs — within the org cap.
        node: ['22.x', '22.21.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # pnpm version comes from package.json `packageManager` field; do not
        # also pass `version:` here — pnpm/action-setup rejects the duplicate
        # spec with ERR_PNPM_BAD_PM_VERSION.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # v0.10.2: build before test, same reason as the test job above.
      - run: pnpm build
      - run: pnpm test
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
      - name: verify mazur.generated.jsonl matches golden
        shell: bash
        # ci-future-B-002: this gate is NON-VACUOUS by construction. The
        # mazur engine test (test/mazur.engine.test.ts) writes
        # tmp/mazur.generated.jsonl UNCONDITIONALLY via writeFileSync, so the
        # file MUST exist after `pnpm test`. If it does not, the determinism
        # gate has lost its input and CANNOT go RED on a real drift — that is
        # a gate failure, not a skip. Fail loudly instead of silently passing.
        run: |
          if [ -f tmp/mazur.generated.jsonl ]; then
            diff fixtures/mazur.golden.jsonl tmp/mazur.generated.jsonl
          else
            echo "FAIL: determinism gate cannot run — golden not produced (tmp/mazur.generated.jsonl missing after pnpm test). A gate that cannot go RED is not a gate." >&2
            exit 1
          fi

  audit:
    name: dependency audit (pnpm audit, moderate+)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ci-future-B-007: bound a hung audit/registry call
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # shipcheck D3: dependency-CVE scanning runs in CI. CodeQL (separate
      # workflow) handles SAST; this job handles dep-side CVEs.
      #
      # ci-future-B-005: scoped to --prod so the gate blocks on SHIPPED deps
      # only (the single runtime dep, ajv). The full tree includes devDeps
      # (tsx / typescript) that never reach a user's install; a dev-tool
      # advisory blocking an unrelated PR is noise, not a real supply-chain
      # signal. Two-tier:
      #   1. BLOCKING: prod tree at moderate+ (what users actually receive).
      #   2. VISIBLE (non-blocking): full tree incl. devDeps, reported but
      #      never failing CI (`|| true`) so dev-tool advisories surface in
      #      logs without gating contributors.
      - name: dependency audit (prod — blocking)
        run: pnpm audit --prod --audit-level=moderate
      - name: dependency audit (full tree incl. devDeps — visible, non-blocking)
        run: pnpm audit --audit-level=moderate || true

  torch-e2e:
    # G-017 — validate the LIVE PyTorch helper's REAL emission path against
    # real torch. The rest of CI runs torchless, so the torch-gated test
    # (test/import-pytorch-helper.torch-e2e.test.ts) SKIPS there; this job
    # installs CPU torch so it actually runs. Catches latent helper bugs that
    # hand-authored fixtures can't (per-neuron bias structure, factor
    # decomposition, sign conventions, Adam/AdamW state semantics) plus the
    # boundary rejections (amsgrad / maximize / dampening / multi-param-group).
    # ubuntu-latest, single OS (CPU torch only). Runs on the normal triggers.
    name: torch end-to-end (live helper)
    runs-on: ubuntu-latest
    # ci-future-B-009: skip the costly CPU-torch wheel install unless the
    # import/emission helper path changed, or on a manual workflow_dispatch.
    needs: changes
    if: ${{ needs.changes.outputs.helpers == 'true' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 25  # ci-future-B-007: torch wheel install dominates; bound it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # CPU-only torch wheel — no CUDA, fast install, deterministic on CPU.
      # ci-future-B-001: versions are PINNED in scripts/extract/requirements-cpu.txt
      # so the live-helper validation is reproducible (PIN_PER_STEP). An
      # unpinned `pip install torch numpy` lets an upstream point-release change
      # tensor/optimizer semantics under us; the pin freezes the validation env.
      - name: install CPU torch (pinned)
        run: python -m pip install --upgrade pip && python -m pip install -r scripts/extract/requirements-cpu.txt --index-url https://download.pytorch.org/whl/cpu
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Run ONLY the torch-gated suite. BP_TORCH_PYTHON points the test at the
      # interpreter that has torch installed; the test would otherwise skip.
      - name: torch-gated live-helper end-to-end test
        run: node --import tsx --test test/import-pytorch-helper.torch-e2e.test.ts
        env:
          BP_TORCH_PYTHON: python
          NO_COLOR: '1'
          FORCE_COLOR: '0'

  jax-e2e:
    # Validate the LIVE JAX helper's REAL emission path against real JAX. The
    # rest of CI runs JAX-less, so the jax-gated test
    # (test/import-jax-helper.jax-e2e.test.ts) SKIPS there; this job installs CPU
    # jax+jaxlib so it actually runs. Catches latent helper bugs that
    # hand-authored fixtures can't (jax.grad descent gradients, jax.make_jaxpr
    # forensic digest, the pytree->per-neuron-bias scalar mapping, the
    # output-signal descent sign, optax-style Adam m/v with the documented
    # NON-flip) plus the boundary rejections (x64-disabled / adamw / bad-topology).
    # ubuntu-latest, single OS (CPU jax only). Runs on the normal triggers.
    name: jax end-to-end (live helper)
    runs-on: ubuntu-latest
    # ci-future-B-009: skip the costly CPU-jax+jaxlib wheel install unless the
    # import/emission helper path changed, or on a manual workflow_dispatch.
    needs: changes
    if: ${{ needs.changes.outputs.helpers == 'true' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 25  # ci-future-B-007: jaxlib wheel install dominates; bound it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # CPU-only jax+jaxlib — no CUDA/TPU, deterministic on CPU. The helper
      # REQUIRES jax_enable_x64 + CPU (the determinism contract; enforced at the
      # extraction boundary). Versions are PINNED in
      # scripts/extract/requirements-jax-cpu.txt so the live-helper validation is
      # reproducible (PIN_PER_STEP). An unpinned `pip install jax` lets an
      # upstream point-release change XLA CPU codegen / jax.grad tracing under us.
      - name: install CPU jax (pinned)
        run: python -m pip install --upgrade pip && python -m pip install -r scripts/extract/requirements-jax-cpu.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Run ONLY the jax-gated suite. BP_JAX_PYTHON points the test at the
      # interpreter that has jax installed; the test would otherwise skip.
      - name: jax-gated live-helper end-to-end test
        run: node --import tsx --test test/import-jax-helper.jax-e2e.test.ts
        env:
          BP_JAX_PYTHON: python
          NO_COLOR: '1'
          FORCE_COLOR: '0'
