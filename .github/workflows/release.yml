name: Release

# Release-spine: fires on `v*` tag push AND manual workflow_dispatch
# (the latter lets us re-trigger against an already-pushed tag, which
# is what v0.11.0 needed since this workflow didn't exist when the
# tag was first pushed). Two jobs: verify on a fresh runner, ship only
# if verify passes AND the tag-vs-package.json version equality holds.
#
# Authentication: npm Trusted Publishing (OIDC) — NO secret/token required.
#   The package has a trusted publisher configured on npmjs.com bound to
#   THIS workflow (mcp-tool-shop-org/backprop-trace · release.yml). The
#   ship job's `id-token: write` permission lets npm exchange the GitHub
#   OIDC token for a short-lived, single-use registry credential, and the
#   same exchange generates Sigstore provenance automatically.
#   (History: v0.11.0 published via an NPM_TOKEN secret; that token expired
#   in 2026-06 and was replaced by OIDC trusted publishing — no rotating
#   secret to leak or expire. Requires npm >= 11.5.1, installed below.)
#
# Triggering:
#   - Push a `v*` tag: `git tag v0.11.1 && git push --tags`
#   - Manual: `gh workflow run release.yml --ref v0.11.0`
#
# Tag-vs-package.json gate: a tag whose name (minus `v`) doesn't match
# package.json version fails BEFORE any npm.publish side effect.
#
# Mirrors mcp-tool-shop-org/vocal-synth-engine's release.yml (canonical
# org template per memory note 2026-05-15) with pnpm + pnpm verify
# substituted for npm + verify.sh.
#
# ci-future-B-004 (honesty): actions below are pinned to MOVING MAJOR TAGS
# (@v4 / @v3), NOT full commit SHAs — matching the convention used across
# every workflow in this repo (ci.yml, codeql.yml, pages.yml, pack-smoke.yml).
# An earlier version of this header claimed "pinned action SHAs"; that was
# never true and is corrected here. If this repo later adopts SHA-pinning, do
# it repo-wide (all workflows) and update this comment in the same change.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Stage 1: re-run the verify gate against the tagged commit ──
  # Guards against tagging a commit that hasn't been gated by ci.yml.
  # We re-run pnpm verify (typecheck + test + build) + pack-smoke
  # against the tagged ref so a tag pointing at unverified history
  # can never trigger the ship job.
  verify:
    name: verify (ubuntu-latest / node-22)
    runs-on: ubuntu-latest
    timeout-minutes: 20  # ci-future-B-007: bound a hung verify/pack-smoke gate
    env:
      NO_COLOR: '1'
      FORCE_COLOR: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # pnpm version comes from package.json `packageManager` field
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify gate
        run: pnpm verify

      - name: Pack-install smoke
        run: pnpm pack-smoke

  # ── Stage 2: publish to npm + create GH release ──
  ship:
    name: ship (npm publish + gh release)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15  # ci-future-B-007: bound a hung npm publish / gh release
    permissions:
      id-token: write  # Sigstore provenance (OIDC token)
      contents: write  # gh release create
    env:
      NO_COLOR: '1'
      FORCE_COLOR: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Hard gate: tag name (minus leading `v`) MUST match package.json
      # version. Mismatch is a release-engineering error and must fail
      # loud before any npm.publish side effect.
      - name: Tag-vs-package.json version equality
        id: version-check
        shell: bash
        run: |
          TAG_REF="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_REF#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag_ref=$TAG_REF"
          echo "tag_version=$TAG_VERSION"
          echo "pkg_version=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_REF does not match package.json version $PKG_VERSION (expected v$PKG_VERSION)"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      # OIDC trusted publishing requires npm >= 11.5.1; Node 22 bundles
      # npm 10.9.x, so upgrade the global npm before the publish call.
      - name: Upgrade npm for OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish to npm with Sigstore provenance
        # Auth via npm Trusted Publishing (OIDC) — intentionally NO
        # NODE_AUTH_TOKEN. With id-token:write + a configured trusted
        # publisher, npm mints a short-lived registry credential from the
        # GitHub OIDC token and generates Sigstore provenance in one step.
        run: npm publish --provenance --access public

      # Extract the CHANGELOG section for this version (Keep-a-Changelog
      # format: `## [X.Y.Z] - YYYY-MM-DD` heading per version). Slice
      # from this version's heading to (but not including) the next
      # `## [` heading.
      - name: Extract CHANGELOG entry
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.version-check.outputs.version }}"
          BODY=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="See CHANGELOG.md for v$VERSION details."
          fi
          echo "$BODY" > /tmp/release-notes.md
          echo "notes_file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"
          echo "--- extracted release notes ---"
          cat /tmp/release-notes.md
          echo "--- end ---"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            --verify-tag
